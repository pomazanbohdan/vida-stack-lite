# Synchronous freshness in development; no watcher or queries during frozen checks.
format = "compact"
semantic = true
auto_update = true
async_update = false
exclude = [
  "BASE/**", ".agent/**", ".tmp/**", ".planning/**", ".lean-ctx/**",
  "**/node_modules/**", "**/dist/**", "**/build/**", "**/coverage/**",
  "**/.stryker-tmp*/**", ".git/**"
]
