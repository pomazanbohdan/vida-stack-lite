name: VIDA native delivery
on:
  workflow_dispatch:
    inputs:
      request:
        description: Complete controller-issued VidaCIDeliveryRequest/v1 JSON
        required: true
        type: string
      request_linux:
        description: Optional controller-issued Linux request for the same operation and Source
        required: false
        type: string
      source_commit:
        description: Controller-selected published commit
        required: true
        type: string
      publish:
        description: Publish verified native pair as a public GitHub Release
        required: false
        type: boolean
        default: false
      diagnose_runtime:
        description: Diagnose one Linux CLI case without formation or publication
        required: false
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
concurrency:
  group: ${{ inputs.publish && 'vida-native-publication' || format('vida-native-{0}-{1}', fromJSON(inputs.request).request_id, fromJSON(inputs.request).target) }}
  cancel-in-progress: false
jobs:
  native-windows-x64:
    name: native-windows-x64
    if: ${{ vars.VIDA_NATIVE_CI_ENABLED == 'true' && !inputs.diagnose_runtime }}
    runs-on: windows-2025
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      producer_attempt: ${{ github.run_attempt }}
    env:
      VIDA_NATIVE_CI_ENABLED: ${{ vars.VIDA_NATIVE_CI_ENABLED }}
      CI_REQUEST: ${{ inputs.request }}
      CI_PUBLICATION: ${{ inputs.publish }}
      CI_REQUEST_LINUX: ${{ inputs.request_linux }}
      CI_SOURCE_COMMIT: ${{ inputs.source_commit }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - &shared-selected-source
        name: selected-source
        run: |
          $ErrorActionPreference = 'Stop'
          ('BUN_INSTALL_CACHE_DIR=' + (Join-Path $env:RUNNER_TEMP 'vida-bun-install-cache')) | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($env:CI_SOURCE_COMMIT -cnotmatch '^[a-f0-9]{40}$' -or $env:CI_SOURCE_COMMIT -cne $env:GITHUB_SHA) { throw 'Selected published Source differs' }
          if ($env:GITHUB_REPOSITORY -cne 'pomazanbohdan/vida-stack-lite' -or $env:GITHUB_REPOSITORY_ID -cne '1340911900') { throw 'Selected repository differs' }
           if ($env:CI_PUBLICATION -ceq 'true' -and [string]::IsNullOrWhiteSpace($env:CI_REQUEST_LINUX)) { throw 'Publication requires the Linux native request' }
      - &shared-checkout
        name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - &shared-bun
        name: bun
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: packages/agent/.bun-version
      - &shared-bun-dependency-cache
        name: bun-dependency-cache
        id: bun-dependency-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/vida-bun-install-cache
          key: vida-bun-install-v1-${{ runner.os }}-${{ runner.arch }}-release4-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('packages/agent/.bun-version', 'packages/agent/bun.lock', 'packages/agent/package.json') }}
          restore-keys: |
            vida-bun-install-v1-${{ runner.os }}-${{ runner.arch }}-release4-bun-${{ steps.bun.outputs.bun-version }}-
      - &shared-isolated-source
        name: isolated-source
        env:
          CACHE_PRIMARY_KEY: ${{ steps.bun-dependency-cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.bun-dependency-cache.outputs.cache-matched-key }}
          CACHE_HIT: ${{ steps.bun-dependency-cache.outputs.cache-hit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = (Get-Content -LiteralPath 'packages/agent/.bun-version' -Raw).Trim()
          if ($pin -cnotmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Selected Bun pin is invalid' }
          $cacheNamespace = 'vida-bun-install-v1-' + $env:RUNNER_OS + '-' + $env:RUNNER_ARCH + '-release4-bun-' + $pin + '-'
          $cacheKeyPattern = '^' + [regex]::Escape($cacheNamespace) + '[a-f0-9]{64}$'
          $cacheHit = [string]$env:CACHE_HIT
          if ($env:CACHE_PRIMARY_KEY -cnotmatch $cacheKeyPattern -or
              ($env:CACHE_MATCHED_KEY -and $env:CACHE_MATCHED_KEY -cnotmatch $cacheKeyPattern) -or
              $cacheHit -cnotin @('', 'false', 'true') -or
              ($cacheHit -ceq 'true' -and $env:CACHE_MATCHED_KEY -cne $env:CACHE_PRIMARY_KEY) -or
              ($cacheHit -cne 'true' -and $env:CACHE_MATCHED_KEY -and $env:CACHE_MATCHED_KEY -ceq $env:CACHE_PRIMARY_KEY)) { throw 'Restored dependency cache key is invalid' }
          if ($env:GITHUB_RUN_ID -notmatch '^\d+$' -or $env:GITHUB_RUN_ATTEMPT -notmatch '^[1-9]\d*$') { throw 'Actual run identity unavailable' }
          $mirror = Join-Path $env:RUNNER_TEMP ('vida-ci-source-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $mirror) { throw 'Retained Source preparation; inspect UNKNOWN before replay' }
          New-Item -ItemType Directory -Path $mirror | Out-Null
          $excluded = @('node_modules','dist','coverage','.pack-inspect','.agent','.tmp','.git')
          $generated = @('packages/agent/node_modules','packages/agent/dist','packages/agent/coverage','packages/agent/.tmp',
            'packages/plugin/node_modules','packages/plugin/dist','packages/plugin/coverage','packages/plugin/.tmp')
          function Copy-SourceDirectory([string] $source, [string] $destination) {
            New-Item -ItemType Directory -Path $destination | Out-Null
            foreach ($entry in Get-ChildItem -LiteralPath $source -Force) {
              if ($entry.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Linked Source input' }
              if ($entry.PSIsContainer -and $excluded -contains $entry.Name) {
                $relative = [IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $entry.FullName).Replace('\', '/')
                if ($generated -cnotcontains $relative) { throw 'Unsupported Source directory excluded from binding' }
                continue
              }
              $target = Join-Path $destination $entry.Name
              if ($entry.PSIsContainer) { Copy-SourceDirectory $entry.FullName $target }
              else { Copy-Item -LiteralPath $entry.FullName -Destination $target }
            }
          }
          New-Item -ItemType Directory -Path (Join-Path $mirror 'packages') | Out-Null
          $package = Join-Path $mirror 'packages/agent'
          Copy-SourceDirectory (Join-Path $env:GITHUB_WORKSPACE 'packages/agent') $package
          # Install from the package's own lock before any parent workspace manifest exists.
          Push-Location $package
          try {
            bun install --frozen-lockfile --ignore-scripts --linker=hoisted --backend=copyfile
            if ($LASTEXITCODE -ne 0) { throw 'Frozen producer dependencies unavailable' }
          } finally { Pop-Location }
          # Full development assurance needs tracked test data outside the native package roots.
          # The package lock is installed first, without the parent workspace manifest.
          $tracked = (git -C $env:GITHUB_WORKSPACE ls-files -z) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Tracked Source inventory unavailable' }
          foreach ($file in $tracked.Split([char[]]@([char]0), [StringSplitOptions]::RemoveEmptyEntries)) {
            if ($file.StartsWith('packages/agent/', [StringComparison]::Ordinal)) { continue }
            if ([IO.Path]::IsPathRooted($file) -or $file -match '(^|/)\.\.?(/|$)' -or $file.Contains('\')) { throw 'Unsafe tracked Source path' }
            $source = Join-Path $env:GITHUB_WORKSPACE $file
            $entry = Get-Item -LiteralPath $source -Force
            if ($entry.PSIsContainer -or $entry.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Non-regular declared Source' }
            $target = Join-Path $mirror $file
            [IO.Directory]::CreateDirectory([IO.Path]::GetDirectoryName($target)) | Out-Null
            [IO.File]::Copy($source, $target, $false)
            if ($IsLinux) { [IO.File]::SetUnixFileMode($target, [IO.File]::GetUnixFileMode($source)) }
          }
          "VIDA_CI_SOURCE_ROOT=$mirror" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - &shared-save-bun-dependency-cache
        id: save-bun-dependency-cache
        name: save-bun-dependency-cache
        if: ${{ steps.bun-dependency-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/vida-bun-install-cache
          key: ${{ steps.bun-dependency-cache.outputs.cache-primary-key }}
      - &shared-require-bun-dependency-cache-evidence
        name: require-bun-dependency-cache-evidence
        env:
          CACHE_KEY: ${{ steps.bun-dependency-cache.outputs.cache-primary-key }}
          CACHE_HIT: ${{ steps.bun-dependency-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.bun-dependency-cache.outputs.cache-matched-key }}
          CACHE_SAVE_OUTCOME: ${{ steps.save-bun-dependency-cache.outcome }}
          GITHUB_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = (Get-Content -LiteralPath 'packages/agent/.bun-version' -Raw).Trim()
          if ($pin -cnotmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw 'Selected Bun pin is invalid' }
          $keyPattern = '^vida-bun-install-v1-[A-Za-z0-9_-]+-release4-bun-' + [regex]::Escape($pin) + '-[a-f0-9]{64}$'
          if ($env:CACHE_KEY -cnotmatch $keyPattern) { throw 'Exact dependency cache key is missing or invalid' }
          $cache = Join-Path $env:RUNNER_TEMP 'vida-bun-install-cache'
          if (-not (Test-Path -LiteralPath $cache -PathType Container)) { throw 'Bun dependency cache directory is absent' }
          $entry = Get-ChildItem -LiteralPath $cache -File -Recurse -Force | Select-Object -First 1
          if (-not $entry) { throw 'Bun dependency cache is empty after frozen install' }
          $keyNamespace = $env:CACHE_KEY.Substring(0, $env:CACHE_KEY.Length - 64)
          if ($env:CACHE_MATCHED_KEY -and ($env:CACHE_MATCHED_KEY -cnotmatch $keyPattern -or -not $env:CACHE_MATCHED_KEY.StartsWith($keyNamespace, [StringComparison]::Ordinal))) { throw 'Restore matched key is outside the selected Bun/platform namespace' }
          if ($env:CACHE_HIT -ceq 'true' -and $env:CACHE_MATCHED_KEY -ceq $env:CACHE_KEY -and $env:CACHE_SAVE_OUTCOME -ceq 'skipped') {
            $restore = 'hit'
            $saveAction = 'skipped'
          } elseif (($env:CACHE_HIT -ceq 'false' -or $env:CACHE_HIT -ceq '') -and $env:CACHE_SAVE_OUTCOME -ceq 'success') {
            $restore = 'miss'
            $saveAction = 'success'
          } else { throw 'Dependency cache was neither exactly reused nor followed by a successful save attempt' }
          $api = [Uri]$env:API_URL
          if ($api.Scheme -cne 'https' -or $api.Host -cne 'api.github.com' -or $env:REPOSITORY -cne 'pomazanbohdan/vida-stack-lite' -or $env:REF -cnotmatch '^refs/heads/[A-Za-z0-9._/-]+$' -or -not $env:GITHUB_TOKEN) { throw 'Approved GitHub cache API context is unavailable' }
          $query = 'key=' + [Uri]::EscapeDataString($env:CACHE_KEY) + '&ref=' + [Uri]::EscapeDataString($env:REF) + '&per_page=100'
          $uri = $api.AbsoluteUri.TrimEnd('/') + '/repos/' + $env:REPOSITORY + '/actions/caches?' + $query
          $headers = @{ Accept='application/vnd.github+json'; Authorization=('Bearer ' + $env:GITHUB_TOKEN); 'X-GitHub-Api-Version'='2022-11-28' }
          $listing = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers -TimeoutSec 20
          if (($listing.total_count -isnot [int] -and $listing.total_count -isnot [long]) -or $listing.total_count -lt 0 -or $listing.total_count -gt 100 -or $listing.actions_caches.Count -gt 100) { throw 'Cache API result exceeds its bounded page' }
          $matches = @($listing.actions_caches | Where-Object { $_.key -ceq $env:CACHE_KEY -and $_.ref -ceq $env:REF })
          if ($matches.Count -ne 1) { throw 'Exact selected cache key/ref is absent or ambiguous after restore/save' }
          $entry = $matches[0]
          if (($entry.id -isnot [long] -and $entry.id -isnot [int]) -or $entry.id -lt 1 -or $entry.id -gt 9007199254740991 -or ($entry.size_in_bytes -isnot [long] -and $entry.size_in_bytes -isnot [int]) -or $entry.size_in_bytes -lt 1 -or $entry.size_in_bytes -gt 9007199254740991 -or $entry.version -isnot [string] -or $entry.version.Length -lt 1 -or $entry.version.Length -gt 256 -or $entry.version -match '[\p{Cc}]') { throw 'Exact cache API metadata is invalid' }
          "VIDA_CI_CACHE_ID=$($entry.id)" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIDA_CI_CACHE_KEY=$($entry.key)" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIDA_CI_CACHE_REF=$($entry.ref)" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIDA_CI_CACHE_VERSION=$($entry.version)" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIDA_CI_CACHE_BYTES=$($entry.size_in_bytes)" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIDA_CI_CACHE_MATCHED_KEY=$env:CACHE_MATCHED_KEY" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIDA_CI_CACHE_RESTORE=$restore" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIDA_CI_CACHE_SAVE=confirmed" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIDA_CI_CACHE_SAVE_ACTION=$saveAction" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - &shared-native-build
        id: native-build
        name: native-build
        run: bun --no-env-file --no-install "$env:VIDA_CI_SOURCE_ROOT/tooling/agent/native-ci-delivery.ts" --phase native-build
      - &shared-emit-build
        id: emit-build
        name: emit-build
        run: bun --no-env-file --no-install "$env:VIDA_CI_SOURCE_ROOT/tooling/agent/native-ci-delivery.ts" --phase emit-build
      - name: upload
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.emit-build.outputs.artifact_name }}
          path: |
            ${{ steps.emit-build.outputs.directory }}/${{ steps.emit-build.outputs.archive_file }}
            ${{ steps.emit-build.outputs.directory }}/${{ steps.emit-build.outputs.asset_file }}
            ${{ steps.emit-build.outputs.directory }}/manifest.json
            ${{ steps.emit-build.outputs.directory }}/candidate.json
            ${{ steps.emit-build.outputs.directory }}/native-build.result.json
            ${{ steps.emit-build.outputs.directory }}/install-windows.ps1
          archive: true
          compression-level: 0
          overwrite: false
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
      - &shared-upload-formation-proof
        name: upload-formation-proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.emit-build.outputs.formation_artifact_name }}
          path: |
            ${{ steps.emit-build.outputs.formation_directory }}/${{ steps.emit-build.outputs.formation_archive_file }}
            ${{ steps.emit-build.outputs.formation_directory }}/result.json
            ${{ steps.emit-build.outputs.formation_directory }}/candidate.json
          archive: true
          compression-level: 0
          overwrite: false
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
  release-assurance:
    name: release-assurance
    if: ${{ vars.VIDA_NATIVE_CI_ENABLED == 'true' && inputs.publish && !inputs.diagnose_runtime }}
    runs-on: ubuntu-24.04
    env:
      VIDA_NATIVE_CI_ENABLED: ${{ vars.VIDA_NATIVE_CI_ENABLED }}
      CI_REQUEST: ${{ inputs.request_linux }}
      CI_REQUEST_LINUX: ${{ inputs.request_linux }}
      CI_PUBLICATION: ${{ inputs.publish }}
      CI_SOURCE_COMMIT: ${{ inputs.source_commit }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - *shared-selected-source
      - *shared-checkout
      - *shared-bun
      - *shared-bun-dependency-cache
      - *shared-isolated-source
      - *shared-save-bun-dependency-cache
      - *shared-require-bun-dependency-cache-evidence
      - name: release-assurance
        id: source-quality
        run: bun --no-env-file --no-install "$env:VIDA_CI_SOURCE_ROOT/tooling/agent/release-ci-source-quality.ts"
      - name: retain-release-assurance-evidence
        if: ${{ always() && steps.source-quality.outputs.evidence_directory != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vida-release-assurance-${{ github.run_id }}-${{ github.run_attempt }}-linux
          path: |
            ${{ steps.source-quality.outputs.evidence_directory }}
            ${{ steps.source-quality.outputs.runner_report_directory }}
          archive: true
          compression-level: 6
          overwrite: false
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
  diagnose-public-cli-runtime:
    name: diagnose-public-cli-runtime
    if: ${{ vars.VIDA_NATIVE_CI_ENABLED == 'true' && inputs.diagnose_runtime && !inputs.publish && inputs.request_linux != '' }}
    runs-on: ubuntu-24.04
    env:
      VIDA_NATIVE_CI_ENABLED: ${{ vars.VIDA_NATIVE_CI_ENABLED }}
      CI_REQUEST: ${{ inputs.request_linux }}
      CI_REQUEST_LINUX: ${{ inputs.request_linux }}
      CI_PUBLICATION: ${{ inputs.publish }}
      CI_DIAGNOSE_RUNTIME: ${{ inputs.diagnose_runtime }}
      CI_SOURCE_COMMIT: ${{ inputs.source_commit }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - *shared-selected-source
      - *shared-checkout
      - *shared-bun
      - *shared-bun-dependency-cache
      - *shared-isolated-source
      - *shared-save-bun-dependency-cache
      - *shared-require-bun-dependency-cache-evidence
      - name: public-cli-runtime-diagnostic
        run: bun --no-env-file --no-install "$env:VIDA_CI_SOURCE_ROOT/tooling/agent/ci-runtime-diagnostic.ts"
      - name: retain-public-cli-runtime-diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vida-public-cli-runtime-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}-linux
          path: |
            ${{ env.VIDA_CI_SOURCE_ROOT }}/packages/agent/.tmp/release-runtime-diagnostic/${{ github.run_id }}-${{ github.run_attempt }}
            ${{ env.VIDA_CI_SOURCE_ROOT }}/packages/agent/coverage/sdk-test-inputs
          archive: true
          compression-level: 6
          overwrite: false
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
  native-linux-x64:
    name: native-linux-x64
    needs: release-assurance
    if: ${{ always() && vars.VIDA_NATIVE_CI_ENABLED == 'true' && !inputs.diagnose_runtime && inputs.request_linux != '' && (!inputs.publish || needs.release-assurance.result == 'success') }}
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      producer_attempt: ${{ github.run_attempt }}
    env:
      VIDA_NATIVE_CI_ENABLED: ${{ vars.VIDA_NATIVE_CI_ENABLED }}
      CI_REQUEST: ${{ inputs.request_linux }}
      CI_REQUEST_LINUX: ${{ inputs.request_linux }}
      CI_PUBLICATION: ${{ inputs.publish }}
      CI_SOURCE_COMMIT: ${{ inputs.source_commit }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - *shared-selected-source
      - *shared-checkout
      - *shared-bun
      - *shared-bun-dependency-cache
      - *shared-isolated-source
      - *shared-save-bun-dependency-cache
      - *shared-require-bun-dependency-cache-evidence
      - *shared-native-build
      - *shared-emit-build
      - name: upload
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.emit-build.outputs.artifact_name }}
          path: |
            ${{ steps.emit-build.outputs.directory }}/${{ steps.emit-build.outputs.archive_file }}
            ${{ steps.emit-build.outputs.directory }}/${{ steps.emit-build.outputs.asset_file }}
            ${{ steps.emit-build.outputs.directory }}/manifest.json
            ${{ steps.emit-build.outputs.directory }}/candidate.json
            ${{ steps.emit-build.outputs.directory }}/native-build.result.json
          archive: true
          compression-level: 0
          overwrite: false
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
      - *shared-upload-formation-proof
  publish:
    name: publish-public-release
    outputs:
      tag: ${{ steps.publish-release.outputs.tag }}
      version: ${{ steps.publish-release.outputs.version }}
      bash_installer_sha256: ${{ steps.publish-release.outputs.bash_installer_sha256 }}
    needs:
      - release-assurance
      - native-windows-x64
      - native-linux-x64
    if: ${{ always() && inputs.publish && needs.release-assurance.result == 'success' }}
    runs-on: windows-2025
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      VIDA_NATIVE_CI_ENABLED: ${{ vars.VIDA_NATIVE_CI_ENABLED }}
      CI_REQUEST: ${{ inputs.request }}
      CI_REQUEST_LINUX: ${{ inputs.request_linux }}
      CI_SOURCE_COMMIT: ${{ inputs.source_commit }}
      CI_WINDOWS_RESULT: ${{ needs.native-windows-x64.result }}
      CI_LINUX_RESULT: ${{ needs.native-linux-x64.result }}
      CI_WINDOWS_ARTIFACT_ID: ${{ needs.native-windows-x64.outputs.artifact_id }}
      CI_LINUX_ARTIFACT_ID: ${{ needs.native-linux-x64.outputs.artifact_id }}
      CI_WINDOWS_PRODUCER_ATTEMPT: ${{ needs.native-windows-x64.outputs.producer_attempt }}
      CI_LINUX_PRODUCER_ATTEMPT: ${{ needs.native-linux-x64.outputs.producer_attempt }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - *shared-selected-source
      - *shared-checkout
      - *shared-bun
      - name: publisher-dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: packages/agent
      - name: publish-release
        id: publish-release
        run: bun --no-env-file --no-install tooling/agent/release-ci-publisher.ts
      - name: upload-publication-receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vida-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ci-publication/receipt.json
          overwrite: false
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
  external-linux-install:
    name: external-linux-install
    needs: publish
    if: ${{ always() && inputs.publish && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      EXPECTED_TAG: ${{ needs.publish.outputs.tag }}
      EXPECTED_VERSION: ${{ needs.publish.outputs.version }}
      EXPECTED_INSTALLER_SHA256: ${{ needs.publish.outputs.bash_installer_sha256 }}
    steps:
      - name: install-public-release-with-system-tools
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          [[ $EXPECTED_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $EXPECTED_TAG == "v$EXPECTED_VERSION" ]]
          [[ $EXPECTED_INSTALLER_SHA256 =~ ^[a-f0-9]{64}$ ]]
          proof="$RUNNER_TEMP/vida-external-install-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ ! -e $proof ]]
          mkdir "$proof" "$proof/home" "$proof/runtime-denials"
          cd "$proof"
          for runtime in bun node jq; do
            printf '#!/bin/sh\nexit 97\n' > "runtime-denials/$runtime"
            chmod 700 "runtime-denials/$runtime"
          done
          export PATH="$proof/runtime-denials:/usr/bin:/bin"
          export HOME="$proof/home"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 --max-time 120 \
            "https://github.com/pomazanbohdan/vida-stack-lite/releases/download/$EXPECTED_TAG/install.sh" -o install.sh
          printf '%s  install.sh\n' "$EXPECTED_INSTALLER_SHA256" | sha256sum --check --strict
          bash ./install.sh > installer.stdout.json 2> installer.stderr.log
          "$HOME/.local/bin/vida-agent" version > runtime.version.json
          [[ $(cat runtime.version.json) == "{\"schema\":\"VidaAgentPackage/v1\",\"name\":\"vida-agent\",\"version\":\"$EXPECTED_VERSION\"}" ]]
          "$HOME/.local/bin/vida-agent" --help > runtime.help.json
          sha256sum "$HOME/.local/bin/vida-agent" > runtime.sha256
          cp "$HOME/.local/bin/.vida-agent-installation" installation.receipt
      - name: retain-external-install-evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vida-external-linux-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vida-external-install-${{ github.run_id }}-${{ github.run_attempt }}/install.sh
            ${{ runner.temp }}/vida-external-install-${{ github.run_id }}-${{ github.run_attempt }}/installer.*
            ${{ runner.temp }}/vida-external-install-${{ github.run_id }}-${{ github.run_attempt }}/runtime.*
            ${{ runner.temp }}/vida-external-install-${{ github.run_id }}-${{ github.run_attempt }}/installation.receipt
          overwrite: false
          if-no-files-found: error
          retention-days: 14
