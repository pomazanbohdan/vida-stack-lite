name: VIDA SDK coverage input formation

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      source_commit:
        description: Optional 40-character commit. Must equal this workflow run's GitHub SHA.
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: vida-sdk-inputs-${{ github.sha }}
  cancel-in-progress: false

jobs:
  form-sdk-inputs:
    name: form-sdk-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SDK_SOURCE_COMMIT: ${{ github.sha }}
      SDK_REQUESTED_COMMIT: ${{ inputs.source_commit }}
    steps:
      - name: selected-source
        shell: bash
        run: |
          set -euo pipefail
          printf 'BUN_INSTALL_CACHE_DIR=%s/vida-bun-install-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REPOSITORY" != "pomazanbohdan/vida-stack-lite" ]]; then
            echo "Unexpected repository: $GITHUB_REPOSITORY" >&2
            exit 1
          fi
          if [[ "$GITHUB_REPOSITORY_ID" != "1340911900" ]]; then
            echo "Unexpected repository ID: $GITHUB_REPOSITORY_ID" >&2
            exit 1
          fi
          if [[ ! "$SDK_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Selected GitHub SHA is not a full commit hash" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "$SDK_REQUESTED_COMMIT" ]]; then
            if [[ ! "$SDK_REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ || "$SDK_REQUESTED_COMMIT" != "$SDK_SOURCE_COMMIT" ]]; then
              echo "Manual source_commit must be a 40-character hash equal to GITHUB_SHA" >&2
              exit 1
            fi
          fi

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: bun
        id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: packages/agent/.bun-version

      - name: prepare-isolated-package-source
        id: prepare-source
        shell: bash
        run: |
          set -euo pipefail
          package_source="$GITHUB_WORKSPACE/packages/agent"
          source_mirror="$RUNNER_TEMP/vida-sdk-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "$source_mirror" ]]; then
            echo "Retained Source preparation exists; inspect it before retrying" >&2
            exit 1
          fi
          if find "$package_source" -type l -print -quit | grep -q .; then
            echo "Package Source contains a symbolic link" >&2
            exit 1
          fi
          mkdir -p "$source_mirror/packages"
          tar -C "$GITHUB_WORKSPACE/packages" \
            --exclude='agent/node_modules' --exclude='agent/**/node_modules' \
            --exclude='agent/dist' --exclude='agent/**/dist' \
            --exclude='agent/coverage' --exclude='agent/**/coverage' \
            --exclude='agent/.tmp' --exclude='agent/**/.tmp' \
            --exclude='agent/.agent' --exclude='agent/**/.agent' \
            --exclude='agent/work' --exclude='agent/**/work' \
            --exclude='agent/.git' --exclude='agent/**/.git' \
            -cf - agent | tar -C "$source_mirror/packages" -xf -
          printf 'source_root=%s\n' "$source_mirror/packages/agent" >> "$GITHUB_OUTPUT"

      - name: restore-bun-dependency-cache
        id: bun-dependency-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/vida-bun-install-cache
          key: vida-sdk-bun-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('packages/agent/.bun-version', 'packages/agent/bun.lock', 'packages/agent/package.json') }}

      - name: install-frozen-dependencies
        working-directory: ${{ steps.prepare-source.outputs.source_root }}
        run: bun install --frozen-lockfile --ignore-scripts --linker=hoisted --backend=copyfile

      - name: save-bun-dependency-cache
        if: ${{ steps.bun-dependency-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/vida-bun-install-cache
          key: ${{ steps.bun-dependency-cache.outputs.cache-primary-key }}

      - name: form-sdk-package
        working-directory: ${{ steps.prepare-source.outputs.source_root }}
        shell: bash
        run: |
          set -euo pipefail
          bun bin/bun.ts tooling/build-package.ts --test-inputs 2>&1 | tee "$RUNNER_TEMP/sdk-formation.log"

      - name: upload-sdk-coverage-inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vida-sdk-test-inputs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare-source.outputs.source_root }}/dist
          if-no-files-found: error
          overwrite: false
          retention-days: 14

      - name: upload-sdk-formation-failure-log
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vida-sdk-test-input-formation-log-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-formation.log
          if-no-files-found: ignore
          overwrite: false
          retention-days: 7
