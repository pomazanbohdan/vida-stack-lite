# User-approved model values (2026-11-08), not an active runtime configuration.
# Strict v1 stays unchanged; Task4 v2 carries this complete ProductModel.
# All repository/product/path/store/hierarchy values below are approved.
# Contract and acceptance: runtime-project-model.md in this directory.
# Paths are repository-relative; documents can overlap code and other products.
# Wiki/requirements/store destinations are approved; no migration is performed here.
# index.md follows the existing standard verified by the topical research.
# Complete fields follow ProductModel/v1; governed owners retain migration authority.
# Type codes come from a fixed runtime catalog, never from a project definition.
# User confirmed VIDA / AGENT / CODEX / POWERS on 2026-11-03; activation is pending.

repository:
  repository_id: vida-agent
  prefix: VIDA

projects:
  - project_id: agent
    title: VIDA Agent
    prefix: AGENT
    project_root: packages/agent
    code_selectors:
      - packages/agent/src/**
      - packages/agent/bin/**
      - packages/agent/schemas/**
      - packages/agent/templates/**
      - packages/agent/instructions/**
      - packages/agent/tooling/**
      - packages/agent/tests/**
      - packages/agent/package.json
    documents:
      root: packages/agent/docs
      index: packages/agent/docs/index.md
      requirements:
        root: packages/agent/docs/requirements
        areas:
          runtime:
            business: packages/agent/docs/requirements/runtime/business
            system: packages/agent/docs/requirements/runtime/system
            acceptance: packages/agent/docs/requirements/runtime/acceptance
            test_cases: packages/agent/docs/requirements/runtime/test-cases
          delivery:
            business: packages/agent/docs/requirements/delivery/business
            system: packages/agent/docs/requirements/delivery/system
            acceptance: packages/agent/docs/requirements/delivery/acceptance
            test_cases: packages/agent/docs/requirements/delivery/test-cases
      research: packages/agent/docs/research
      decisions: packages/agent/docs/decisions
    work_items:
      enabled_types: [TASK, BUG, PBI]
      storage_root: packages/agent/backlogs # Configured path; existence not implied.
      hierarchy:
        mode: custom
        allowed_children:
          PBI: [TASK, BUG]
          BUG: []
          TASK: []

  - project_id: codex
    title: VIDA Codex
    prefix: CODEX
    project_root: packages/codex
    code_selectors: [packages/codex/package.json] # Actual Source; src does not exist.
    documents:
      root: packages/codex/docs
      index: packages/codex/docs/index.md
      requirements:
        root: packages/codex/docs/requirements
        areas:
          integration:
            business: packages/codex/docs/requirements/integration/business
            system: packages/codex/docs/requirements/integration/system
            acceptance: packages/codex/docs/requirements/integration/acceptance
            test_cases: packages/codex/docs/requirements/integration/test-cases
      research: packages/codex/docs/research
      decisions: packages/codex/docs/decisions
    work_items:
      enabled_types: [TASK, BUG, PBI]
      storage_root: packages/codex/backlogs # Configured path; existence not implied.
      hierarchy:
        mode: custom
        allowed_children:
          PBI: [TASK, BUG]
          BUG: []
          TASK: []

  - project_id: powers
    title: VidaPowers
    prefix: POWERS
    project_root: packages/powers
    code_selectors:
      - packages/powers/skills/**
      - packages/powers/scripts/**
      - packages/powers/instructions/**
      - packages/powers/config/**
      - packages/powers/tests/**
      - packages/powers/catalog.json
      - packages/powers/package.json
      - packages/powers/plugin.json
      - packages/powers/.codex-plugin/**
      - packages/powers/.agents/**
    documents:
      root: packages/powers/docs
      index: packages/powers/docs/index.md
      requirements:
        root: packages/powers/docs/requirements
        areas:
          methodology:
            business: packages/powers/docs/requirements/methodology/business
            system: packages/powers/docs/requirements/methodology/system
            acceptance: packages/powers/docs/requirements/methodology/acceptance
            test_cases: packages/powers/docs/requirements/methodology/test-cases
      research: packages/powers/docs/research
      decisions: packages/powers/docs/decisions
    work_items:
      enabled_types: [TASK, BUG, PBI]
      storage_root: packages/powers/docs/work # Product D2; no migration performed.
      hierarchy:
        mode: custom
        allowed_children:
          PBI: [TASK, BUG]
          BUG: []
          TASK: []

# No per-project task_prefix or type-code override.
# No global source_catalog: documents are nested in the product.
# No separate wiki_output/internal/generated-documents corpus.
# Area names/destinations are approved; canonical docs remain owners until supported adoption.
# Work-item keys include their fixed type code, e.g. VIDA-AGENT-BUG-43.
# Containment combinations are generic and configured by each product.
# User-selected initial hierarchy: PBI contains TASK/BUG; BUG/TASK are leaves.
# Standalone TASK is allowed. These are per-product values, not runtime constants.
# Root AGENTS/sidecar integration is not removed by the wiki navigation index.
