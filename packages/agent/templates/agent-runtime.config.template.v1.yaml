workflows:
  information_research_light:
    assurance_profile: research_light
    max_attempts: 1
    entry_stage: research_parallel
    terminal_stages:
      - synthesize_research
    stages:
      - id: research_parallel
        kind: research
        mode: parallel
        assignments:
          - role: documentation-researcher
            profile: web-researcher
            contour: documentation
          - role: code-researcher
            profile: codebase-mapper
            contour: code
          - role: platform-researcher
            profile: web-researcher
            contour: platform
        consumes:
          - WorkItem/v1
        produces:
          - ResearchResult/v1
        required_after: []
      - id: synthesize_research
        kind: synthesize
        mode: single
        assignments:
          - role: research-synthesizer
            profile: researcher
        consumes:
          - ResearchResult/v1
        produces:
          - ResearchSynthesis/v1
        required_after:
          - research_parallel
    edges:
      - - research_parallel
        - synthesize_research
  implementation_new:
    assurance_profile: code_full
    max_attempts: 3
    entry_stage: research_parallel
    terminal_stages:
      - prepare_delivery
    stages:
      - id: research_parallel
        kind: research
        mode: parallel
        assignments:
          - role: requirements-researcher
            profile: researcher
            contour: requirements
          - role: documentation-researcher
            profile: web-researcher
            contour: documentation
          - role: code-researcher
            profile: codebase-mapper
            contour: code
          - role: platform-researcher
            profile: web-researcher
            contour: platform
          - role: security-data-researcher
            profile: researcher
            contour: security_data
            risk_flags:
              - security
              - data_loss
        consumes:
          - WorkItem/v1
        produces:
          - ResearchResult/v1
        required_after: []
      - id: synthesize_task
        kind: synthesize
        mode: single
        assignments:
          - role: research-synthesizer
            profile: researcher
        consumes:
          - ResearchResult/v1
        produces:
          - ResearchSynthesis/v1
          - DevelopmentTaskPacket/v1
        required_after:
          - research_parallel
      - id: develop_change
        kind: develop
        mode: single
        context_source_ids:
          - runtime-development-lifecycle
        assignments:
          - role: developer-orchestrator
            profile: executor
        consumes:
          - DevelopmentTaskPacket/v1
        produces:
          - ImplementationResult/v1
        required_after:
          - review_source_prewrite
      - id: review_source_prewrite
        kind: validate
        mode: parallel
        assignments:
          - role: source-planner
            profile: architect
          - role: security-prewriter
            profile: reviewer-security
            risk_flags:
              - security
              - data_loss
              - migration
              - high
        consumes:
          - DevelopmentTaskPacket/v1
        produces:
          - LifecyclePreparationObservation/v1
        required_after:
          - synthesize_task
      - id: validate_parallel
        kind: validate
        mode: parallel
        assignments:
          - role: correctness-validator
            profile: reviewer-correctness
          - role: requirements-validator
            profile: reviewer-requirements
          - role: security-data-validator
            profile: reviewer-security
            risk_flags:
              - security
              - data_loss
              - migration
        consumes:
          - DevelopmentTaskPacket/v1
          - ImplementationResult/v1
        produces:
          - ValidationReceipt/v1
        required_after:
          - develop_change
      - id: test_repository
        kind: test
        mode: single
        assignments:
          - role: tester
            profile: tester
        consumes:
          - DevelopmentTaskPacket/v1
          - ImplementationResult/v1
          - ValidationReceipt/v1
        produces:
          - TesterInstruction/v1
          - TestReceipt/v1
        required_after:
          - validate_parallel
      - id: prepare_delivery
        kind: deliver
        mode: single
        assignments:
          - role: delivery-agent
            profile: delivery
        consumes:
          - DevelopmentTaskPacket/v1
          - ImplementationResult/v1
          - ValidationReceipt/v1
          - TestReceipt/v1
        produces:
          - DeliveryInstruction/v1
        required_after:
          - test_repository
    edges:
      - - research_parallel
        - synthesize_task
      - - synthesize_task
        - review_source_prewrite
      - - review_source_prewrite
        - develop_change
      - - develop_change
        - validate_parallel
      - - validate_parallel
        - test_repository
      - - test_repository
        - prepare_delivery
