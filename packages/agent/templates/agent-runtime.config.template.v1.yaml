schema: AgentRuntimeConfig/v1
config_id: "{{REPOSITORY}}"
version: 1
config_revision: 1
repository:
  sidecar: AGENT.sidecar.md
  policy: AGENTS.md
  root_markers:
    - AGENTS.md
    - AGENT.sidecar.md
    - agent-runtime.config.v1.yaml
  repository_id: "{{REPOSITORY}}"
  title: "{{REPOSITORY}} repository"
  project_root: .
  code_selectors:
    - src/**
integrations:
  providers:
    - id: local-{{PROJECT}}
      provider: local
      project_id: "{{PROJECT}}"
      tenant_id: local
      namespace: "{{PROJECT}}"
runtime:
  bundle: "{{BUNDLE}}"
  schema_root: "{{BUNDLE}}/schemas"
  instruction_root: "{{BUNDLE}}/instructions"
  tooling_root: "{{BUNDLE}}/tooling"
control:
  work_root: .agent/work
  coordination_ledger: .agent/coordination/ownership.v1.json
  checkpoint_name: resume.json
paths:
  schema: PathProfileConfig/v1
  repository_mode: monorepo
  processing_scope: selected_project
  defaults:
    repository_root: .
    project_root: .
    code_root: src
    documentation_root: docs
    wiki_root: docs
    wiki_path: AGENT.sidecar.md
    wiki_output_root: .planning/agent-flow/wiki-output
    documentation_policy_path: docs/agent-instructions/documentation-policy.v1.json
    documentation_map_path: AGENT.sidecar.md
    documentation_index_path: AGENT.sidecar.md
    documentation_changelog_root: docs
    documentation_evidence_root: .agent/work
    internal_root: docs
    internal_requirements_root: docs
    tests_root: tests
    derived_output_root: .planning/agent-flow
    coordination_root: .agent/coordination
    work_root: .agent/work
    delivery_root: .agent/work
    import_root: .agent/work
    ledger_root: backlogs
projects:
  - project_id: "{{PROJECT}}"
    title: "{{PROJECT}}"
    project_root: .
    wiki_root: docs
    wiki_path: AGENT.sidecar.md
    wiki_output_root: .planning/agent-flow/wiki-output
    internal_root: docs/internal
    ledger_root: backlogs
    task_prefix: TASK
    code_selectors:
      - src/**
    delivery_group: "{{PROJECT}}"
agents:
  profiles:
    executor:
      model: gpt-6-luna
      reasoning: max
      execution_mode: standard
      mutation_scope: repository_source
      tools_policy: developer
      egress_policy: none
    architect:
      model: gpt-6-luna
      reasoning: max
      execution_mode: standard
      mutation_scope: none
      tools_policy: read_only
      egress_policy: official_docs
    researcher:
      model: gpt-6-luna
      reasoning: xhigh
      execution_mode: fast
      mutation_scope: none
      tools_policy: read_only
      egress_policy: official_docs
    web-researcher:
      model: gpt-6-luna
      reasoning: xhigh
      execution_mode: fast
      mutation_scope: none
      tools_policy: read_only
      egress_policy: official_docs
    codebase-mapper:
      model: gpt-6-luna
      reasoning: xhigh
      execution_mode: fast
      mutation_scope: none
      tools_policy: read_only
      egress_policy: none
    reviewer-correctness:
      model: gpt-6-luna
      reasoning: high
      execution_mode: fast
      mutation_scope: none
      tools_policy: validator
      egress_policy: none
    reviewer-security:
      model: gpt-6-luna
      reasoning: high
      execution_mode: fast
      mutation_scope: none
      tools_policy: validator
      egress_policy: official_docs
    reviewer-requirements:
      model: gpt-6-luna
      reasoning: high
      execution_mode: fast
      mutation_scope: none
      tools_policy: validator
      egress_policy: none
    tester:
      model: gpt-6-luna
      reasoning: high
      execution_mode: fast
      mutation_scope: none
      tools_policy: tester
      egress_policy: none
    delivery:
      model: gpt-6-luna
      reasoning: high
      execution_mode: fast
      mutation_scope: none
      tools_policy: delivery
      egress_policy: none
  tool_policies:
    read_only:
      source_write: false
      allowed_tools:
        - runtime.read
        - source.read
        - docs.read
        - web.search
    developer:
      source_write: true
      allowed_tools:
        - runtime.read
        - runtime.write
        - source.read
        - source.write
        - test.execute
    validator:
      source_write: false
      allowed_tools:
        - runtime.read
        - source.read
        - test.read
    tester:
      source_write: false
      allowed_tools:
        - runtime.read
        - source.read
        - test.execute
    delivery:
      source_write: false
      allowed_tools:
        - runtime.read
        - delivery.prepare
        - delivery.execute
  egress_policies:
    none:
      allowed_hosts: []
    official_docs:
      allowed_hosts:
        - a2a-protocol.org
        - modelcontextprotocol.io
        - openai.github.io
        - google.github.io
        - learn.microsoft.com
        - mastra.ai
        - support.atlassian.com
        - github.com
  role_instructions:
    code-researcher:
      description: Configured research role.
      consumes:
        - WorkItem/v1
      produces:
        - ResearchResult/v1
      rules:
        - Inspect existing code patterns and affected symbols without changing
          source.
        - Return exact paths, symbols, callers, tests, and failed-pattern
          evidence.
    correctness-validator:
      description: Configured validate role.
      consumes:
        - DevelopmentTaskPacket/v1
        - ImplementationResult/v1
        - TestReceipt/v1
      produces:
        - ValidationReceipt/v1
      rules:
        - Review observable behavior and root-cause correctness without changing
          source.
        - Return a fingerprint-bound pass or actionable findings.
    delivery-agent:
      description: Configured deliver role.
      consumes:
        - DevelopmentTaskPacket/v1
        - ImplementationResult/v1
        - TestReceipt/v1
        - ValidationReceipt/v1
      produces:
        - DeliveryInstruction/v1
      rules:
        - Prepare deploy and do-not-deploy instructions only after required
          receipts pass.
        - Never change repository source and bind instructions to the
          implementation fingerprint.
    developer-orchestrator:
      description: Configured develop role.
      consumes:
        - DevelopmentTaskPacket/v1
      produces:
        - ImplementationResult/v1
      rules:
        - Implement only the immutable packet within owned paths and source
          revision.
        - Do not research, validate, test independently, deliver, or repeat
          prohibited failed patterns.
    diagnostics-researcher:
      description: Configured research role.
      consumes:
        - WorkItem/v1
      produces:
        - ResearchResult/v1
      rules:
        - Analyze supplied failures and sanitized logs without changing source.
        - Return root-cause hypotheses, reproduced facts, and failed approach
          fingerprints.
    documentation-researcher:
      description: Configured research role.
      consumes:
        - WorkItem/v1
      produces:
        - ResearchResult/v1
      rules:
        - Use official or configured local documentation sources.
        - Return exact document references, version uncertainty, and conflicts.
    platform-researcher:
      description: Configured research role.
      consumes:
        - WorkItem/v1
      produces:
        - ResearchResult/v1
      rules:
        - Research platform contracts and framework constraints without changing
          source.
        - Prefer official sources and record version-sensitive uncertainty.
    regression-validator:
      description: Configured validate role.
      consumes:
        - DevelopmentTaskPacket/v1
        - ImplementationResult/v1
      produces:
        - ValidationReceipt/v1
      rules:
        - Review affected callers and regression risk without changing source.
        - Return a fingerprint-bound pass or actionable findings.
    requirements-researcher:
      description: Configured research role.
      consumes:
        - WorkItem/v1
      produces:
        - ResearchResult/v1
      rules:
        - Trace business intent and acceptance without changing source.
        - Return attributable requirement references and unresolved conflicts.
    requirements-validator:
      description: Configured validate role.
      consumes:
        - DevelopmentTaskPacket/v1
        - ImplementationResult/v1
        - TestReceipt/v1
      produces:
        - ValidationReceipt/v1
      rules:
        - Compare implementation evidence to acceptance and scope without
          changing source.
        - Return a fingerprint-bound pass or actionable findings.
    research-synthesizer:
      description: Configured synthesize role.
      consumes:
        - ResearchResult/v1
        - WorkItem/v1
      produces:
        - DevelopmentTaskPacket/v1
        - ResearchSynthesis/v1
      rules:
        - Merge contour artifacts without inventing facts.
        - Issue one immutable developer packet or one research bundle with
          conflicts explicit.
    security-data-validator:
      description: Configured validate role.
      consumes:
        - DevelopmentTaskPacket/v1
        - ImplementationResult/v1
        - TestReceipt/v1
      produces:
        - ValidationReceipt/v1
      rules:
        - Review security and data constraints without changing source.
        - Return a fingerprint-bound pass or actionable findings.
    source-planner:
      description: Read-only source planner for the current development packet, scoped Source, acceptance criteria, verification, and rollback.
      consumes:
        - DevelopmentTaskPacket/v1
      produces:
        - LifecyclePreparationObservation/v1
      rules:
        - Inspect the actual current DevelopmentTaskPacket, scoped Source, and acceptance evidence before any Source writer is issued.
        - Report a genuine LifecyclePreparationObservation/v1 with kind source_plan and actual evidence_refs.
        - Include scope_acceptance_trace and verification_rollback observations, each tied to actual evidence.
        - Do not infer a plan from the task packet alone and do not mutate Source, the packet, policy, lifecycle state, or Host state.
        - Report a GAP for every unverified mechanic; never infer PASS from a plan or configuration.
    security-prewriter:
      description: Read-only independent security review of high-risk Source work before a Source writer is issued.
      consumes:
        - DevelopmentTaskPacket/v1
      produces:
        - LifecyclePreparationObservation/v1
      rules:
        - Inspect the actual current DevelopmentTaskPacket, scoped Source evidence, and applicable security or data-loss controls.
        - Report a genuine LifecyclePreparationObservation/v1 with kind implementation_policy and actual evidence_refs.
        - Include root_cause_owner, affected_callers, existing_primitives, and prewriter_security_gate observations, each tied to actual evidence.
        - Do not mutate Source, the packet, policy, lifecycle state, or Host state.
        - Report a GAP for every unverified mechanic; never infer PASS from a plan or configuration.
    tester:
      description: Configured test role.
      consumes:
        - DevelopmentTaskPacket/v1
        - ImplementationResult/v1
        - ValidationReceipt/v1
      produces:
        - TestReceipt/v1
        - TesterInstruction/v1
      rules:
        - Execute only packet-specified and configured verification commands
          without changing source.
        - Return sanitized evidence bound to the implementation fingerprint.
    security-data-researcher:
      description: Configured conditional security and data research role.
      consumes:
        - WorkItem/v1
      produces:
        - ResearchResult/v1
      rules:
        - Identify security, authorization, privacy, and data-integrity
          constraints.
        - Return threat and data-boundary evidence without changing source.
teams:
  default-development:
    enabled: true
    default_workflow: task_execution
    allowed_projects:
      - "{{PROJECT}}"
    allowed_work_item_kinds:
      - epic
      - feature
      - pbi
      - story
      - bug
      - task
      - research
    roles:
      requirements-researcher: researcher
      documentation-researcher: web-researcher
      code-researcher: codebase-mapper
      platform-researcher: web-researcher
      diagnostics-researcher: codebase-mapper
      security-data-researcher: researcher
      research-synthesizer: researcher
      developer-orchestrator: executor
      correctness-validator: reviewer-correctness
      regression-validator: reviewer-correctness
      requirements-validator: reviewer-requirements
      security-data-validator: reviewer-security
      source-planner: architect
      security-prewriter: reviewer-security
      tester: tester
      delivery-agent: delivery
    stage_overrides: {}
