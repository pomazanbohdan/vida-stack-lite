        produces:
          - DevelopmentTaskPacket/v1
        required_after: []
      - id: develop_task
        kind: develop
        mode: single
        assignments:
          - role: developer-orchestrator
            profile: executor
        consumes:
          - DevelopmentTaskPacket/v1
        produces:
          - ImplementationResult/v1
        required_after:
          - review_source_prewrite
      - id: review_source_prewrite
        kind: validate
        mode: parallel
        assignments:
          - role: source-planner
            profile: architect
          - role: security-prewriter
            profile: reviewer-security
            risk_flags:
              - security
              - data_loss
              - migration
              - high
        consumes:
          - DevelopmentTaskPacket/v1
        produces:
          - LifecyclePreparationObservation/v1
        required_after:
          - synthesize_task
      - id: validate_focused
        kind: validate
        mode: parallel
        assignments:
          - role: correctness-validator
            profile: reviewer-correctness
          - role: requirements-validator
            profile: reviewer-requirements
        consumes:
          - DevelopmentTaskPacket/v1
          - ImplementationResult/v1
        produces:
          - ValidationReceipt/v1
        required_after:
          - develop_task
      - id: test_task
        kind: test
        mode: single
        assignments:
          - role: tester
            profile: tester
        consumes:
          - DevelopmentTaskPacket/v1
          - ImplementationResult/v1
          - ValidationReceipt/v1
        produces:
          - TesterInstruction/v1
          - TestReceipt/v1
        required_after:
          - validate_focused
      - id: prepare_delivery
        kind: deliver
        mode: single
        assignments:
          - role: delivery-agent
            profile: delivery
        consumes:
          - DevelopmentTaskPacket/v1
          - ImplementationResult/v1
          - ValidationReceipt/v1
          - TestReceipt/v1
        produces:
          - DeliveryInstruction/v1
        required_after:
          - test_task
    edges:
      - - synthesize_task
        - review_source_prewrite
      - - review_source_prewrite
        - develop_task
      - - develop_task
        - validate_focused
      - - validate_focused
        - test_task
      - - test_task
        - prepare_delivery
