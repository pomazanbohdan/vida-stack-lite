authorization:
  cedar:
    policy: |-
      permit (principal, action, resource) when { principal.tenant == resource.tenant && principal.project == resource.project && action in [Action::"read", Action::"invoke"] };
      permit (principal, action, resource) when { principal.role == "developer-orchestrator" && principal.tenant == resource.tenant && principal.project == resource.project && action == Action::"write" };
      permit (principal, action, resource) when { principal.role == "operator" && principal.tenant == resource.tenant && principal.project == resource.project && action == Action::"approve" };
    schema_text: |-
      entity User { role: String, tenant: String, project: String };
      entity Project { tenant: String, project: String };
      action read, invoke, write, approve appliesTo { principal: User, resource: Project, context: { registry_hash: String } };
