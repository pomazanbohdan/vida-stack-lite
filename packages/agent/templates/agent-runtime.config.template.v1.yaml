research_decision:
  schema: ResearchDecisionConfig/v1
  limits:
    max_instruction_bytes: 16384
    max_context_bytes: 16384
    max_projection_bytes: 12288
  paths:
    research_records: docs/agent-instructions/research/records
    decision_records: docs/agent-instructions/decisions/records
    changelog: docs/agent-instructions/agent-instructions.changelog.jsonl
    cache: .planning/agent-flow/cache/instruction-activation.v1.json
    activation_history: .agent/work
  registry:
    schema: InstructionRegistry/v1
    registry_id: agent-runtime-research-decision
    revision: 1
    source_revision: agent-runtime-research-decision-v1
    instructions:
      - instruction_id: dynamic-instruction-activation
        owner: agent-runtime
        revision: 1
        source_path: agent-runtime.config.v1.yaml#research_decision.registry.instructions.0
        source_sha256: 4b8d50c741c7743e8d82602140c651e65c51b7173f2f5dceb38b1a39b382666e
        summary_sha256: 4b8d50c741c7743e8d82602140c651e65c51b7173f2f5dceb38b1a39b382666e
        activation_class: always_on
        triggers: []
        phases: []
        lanes: []
        output_schema: InstructionActivationUse/v1
        max_bytes: 16384
        privacy: internal
        status: active
        content:
          Typed task context selects current instructions; command aliases and
          keyword parsing are never activation inputs. Bindings are
          deterministic, digest-pinned, bounded and privacy-redacted.
      - instruction_id: research-protocol
        owner: agent-runtime
        revision: 1
        source_path: agent-runtime.config.v1.yaml#research_decision.registry.instructions.1
        source_sha256: 9734d3f004e8cd4b41dff91392c8cce842785db5fa57ee33cffb047f96a18c19
        summary_sha256: 9734d3f004e8cd4b41dff91392c8cce842785db5fa57ee33cffb047f96a18c19
        activation_class: lane_entry
        triggers:
          - research_intent
          - domain_question
        phases:
          - trace
          - plan
          - execute
          - verify
        lanes:
          - researcher
          - web-researcher
          - synthesizer
        output_schema: ResearchResult/v1
        max_bytes: 16384
        privacy: internal
        status: active
        content: Research is a bounded evidence exercise. Record source claims,
          findings, uncertainty, conflicts, BR/SR/AC/GAP bindings, completeness
          and readiness without hidden chain-of-thought.
      - instruction_id: web-validation-protocol
        owner: agent-runtime
        revision: 1
        source_path: agent-runtime.config.v1.yaml#research_decision.registry.instructions.2
        source_sha256: d816092108da6cfa8409874a4ebf3330799369e0c74730f53e6cf424f290adc7
        summary_sha256: d816092108da6cfa8409874a4ebf3330799369e0c74730f53e6cf424f290adc7
        activation_class: triggered_domain
        triggers:
          - external_fact
          - api_assumption
          - provider_change
        phases:
          - trace
          - plan
          - execute
          - verify
        lanes:
          - researcher
          - web-researcher
          - synthesizer
        output_schema: ResearchResult/v1
        max_bytes: 16384
        privacy: internal
        status: active
        content:
          External facts require independent sources; security, architecture and
          compliance topics require three. API, server and provider assumptions
          require a live check; conflicts and gaps remain blocked.
      - instruction_id: decision-recording-protocol
        owner: agent-runtime
        revision: 1
        source_path: agent-runtime.config.v1.yaml#research_decision.registry.instructions.3
        source_sha256: 3a7943ed3b1af0dc42445a1f94d4e3aa25e7bcaceea26007f41b1198522a0e35
        summary_sha256: 3a7943ed3b1af0dc42445a1f94d4e3aa25e7bcaceea26007f41b1198522a0e35
        activation_class: lane_entry
        triggers:
          - option_selection
          - decision_needed
        phases:
          - trace
          - plan
          - execute
          - verify
          - delivery
        lanes:
          - synthesizer
          - implementation-planner
          - executor
        output_schema: DecisionRecord/v1
        max_bytes: 16384
        privacy: internal
        status: active
        content:
          Record statement, context, options, selection, rationale, evidence and
          revisit conditions. An agent may propose but never accept a business
          or technical decision.
      - instruction_id: decision-closure-reflection
        owner: agent-runtime
        revision: 1
        source_path: agent-runtime.config.v1.yaml#research_decision.registry.instructions.4
        source_sha256: e8601793cb7041128b9f10226ad7124c554df236bd5dc625695e0f3da9908810
        summary_sha256: e8601793cb7041128b9f10226ad7124c554df236bd5dc625695e0f3da9908810
        activation_class: closure_reflection
        triggers:
          - conflict
          - material_gap
          - supersession
          - correction
          - closeout
        phases:
          - verify
          - delivery
          - closeout
        lanes:
          - synthesizer
          - implementation-planner
          - executor
        output_schema: DecisionRecord/v1
        max_bytes: 16384
        privacy: internal
        status: active
        content:
          Recheck completeness, source freshness, conflicts and supersession at
          correction, conflict and closeout boundaries; keep accepted records
          immutable.
      - instruction_id: synthesis-protocol
        owner: agent-runtime
        revision: 1
        source_path: agent-runtime.config.v1.yaml#research_decision.registry.instructions.5
        source_sha256: b4b3000beca312dc6fca27bac08f7ec5f06c869f8ce2f4c8da61c8304c4f5ae8
        summary_sha256: b4b3000beca312dc6fca27bac08f7ec5f06c869f8ce2f4c8da61c8304c4f5ae8
        activation_class: lane_entry
        triggers:
          - research_intent
        phases:
          - plan
        lanes:
          - synthesizer
        output_schema: ResearchSynthesis/v1
        max_bytes: 16384
        privacy: internal
        status: active
        content: |-
          Aggregate the exact admitted ResearchResult references into one ResearchSynthesis record. Preserve source claims, conflicts, uncertainty, BR/SR/AC/GAP bindings, completeness and readiness; do not invent missing predecessor evidence.
