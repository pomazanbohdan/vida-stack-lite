# Bun runtime and local test configuration.
# Authority/config files remain strict JSON/YAML and are never parsed as JSON5.
telemetry = false
env = false

[install]
saveTextLockfile = true
linker = "hoisted"
auto = "disable"

[test]
root = "./tests"
randomize = true
seed = 20260817
coverage = false
coverageReporter = ["text", "lcov"]
coverageDir = "./coverage"
coverageThreshold = { lines = 1.0, functions = 1.0, statements = 1.0 }
coverageSkipTestFiles = true
