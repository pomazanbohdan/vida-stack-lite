# Vida Powers — donor source manifest
#
# Canonical list of the donor repositories whose snapshots were processed to
# form the canonical instruction corpus (research document, section 4.1).
#
# Every record pins the exact commit the content was taken from, together with
# the license of the source. Local copies live in packages/powers/.tmp/donors —
# that directory is git-ignored and is not a normative source.
#
# Updating: a record is added or replaced together with a fresh snapshot of the
# repository. Changing head_sha without reprocessing the content is forbidden.

