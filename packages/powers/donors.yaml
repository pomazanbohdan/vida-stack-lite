# Vida Powers — donor source manifest
#
# Канонічний перелік донорських репозиторіїв, знімки яких опрацьовано для
# формування канонічного instruction corpus (§4.1 research-документа).
#
# Кожен запис фіксує точний commit, з якого взято зміст, разом із ліцензією
# джерела. Локальні копії живуть у packages/powers/.tmp/donors — цей каталог
# ігнорується Git і не є нормативним джерелом.
#
# Оновлення: запис додається або замінюється разом із перезаписом знімка
# репозиторію. Зміна head_sha без повторного опрацювання змісту заборонена.

schema: vida-powers-donors/v1
product: vida-powers
kind: donor-source-manifest
status: current
updated_at: '2026-10-19'
local_root: packages/powers/.tmp/donors
reproduce: git clone <url> && git checkout --detach <head_sha>

