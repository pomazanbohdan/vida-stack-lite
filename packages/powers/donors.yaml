      (Nielsen, Krug, HIG, The Pragmatic Programmer, DDIA, DDD, Clean Architecture); the guided
      journeys and the case-study files state no norm of their own and are not carried into the
      corpus. The eight engineering pilots, continuous-discovery, inspired-product, jobs-to-be-done, mom-test and lean-startup contributed 144 instructions; 266 candidates remain pending H1
      selection and 30 journey files are excluded.

